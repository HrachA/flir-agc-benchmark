name: CPU tests and published-result verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/check.py --backends python
      - run: python scripts/verify.py --check-export-hashes
      - run: python scripts/report.py --output results/ci-report
